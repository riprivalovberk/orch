[project]
name = "orch"
version = "0.1.0"
description = "Multi-agent SDLC orchestrator: agents plan their own workflow, the plan is validated before anything runs."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "python-ulid>=2.7",
    "typer>=0.12",
    "pydantic-ai-slim[mcp,openai]>=1.0",
    "mcp>=1.10",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
orch = "orch.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pandas>=3.1.0",
    "pyright>=1.1.414",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: calls the real model API and costs credit; run with ORCH_LIVE=1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

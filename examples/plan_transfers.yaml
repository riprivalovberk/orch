objective: Add idempotent POST /transfers
acceptance_criteria:
  AC-1: A repeated Idempotency-Key never double-posts
  AC-2: Amounts are Decimal, never float
  AC-3: Overdrafts are rejected with 422
  AC-4: Logs never contain full account numbers
nodes:
  - {id: write_tests, kind: test, assignee: test_engineer, covers: [AC-1, AC-2, AC-3, AC-4]}
  - {id: implement_transfer, kind: implement, assignee: developer,
     covers: [AC-1, AC-2, AC-3, AC-4]}
  - {id: gates, kind: gate, gates: [pytest, ruff, policy]}
  - {id: review_transfer, kind: review, assignee: reviewer}
  - {id: approve, kind: approval}
edges:
  - [write_tests, implement_transfer, blocks]
  - [implement_transfer, gates, verifies]
  - [implement_transfer, review_transfer, verifies]
  - [implement_transfer, approve, blocks]
